allowBuilds:
  sharp: true
  unrs-resolver: true
# Block installing any version published less than 1 day ago (supply-chain cooldown).
minimumReleaseAge: 1440
# Only these vetted native packages may run install scripts; every other package is blocked.
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
# Patched transitive versions for advisories in eslint and postcss dependencies.
overrides:
  "brace-expansion@<1.1.21": "1.1.21"
  "@humanfs/node@<0.16.8": "0.16.8"
  "source-map-js@<1.2.4": "1.2.4"
